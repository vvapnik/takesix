name: Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# one deployment at a time; a newer push replaces a queued one
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: npm run typecheck
      - run: npm run build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    # pull requests only check that the site builds
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      # IndexNow tells Bing (and through it ChatGPT search and Copilot), Yandex
      # and others that the pages changed. The key is public by design: the
      # site serves it from public/<key>.txt. A failure does not fail the deploy.
      - name: Notify search engines (IndexNow)
        continue-on-error: true
        env:
          KEY: 6af933c1897f861e6c8ad53b46ed9854
        run: |
          urls=$(curl -sf https://takesix.vapnik.de/sitemap.xml | grep -o '<loc>[^<]*' | sed 's/<loc>//' | jq -Rsc 'split("\n") | map(select(length > 0))')
          jq -n --arg key "$KEY" --argjson urls "$urls" \
            '{host: "takesix.vapnik.de", key: $key, keyLocation: "https://takesix.vapnik.de/\($key).txt", urlList: $urls}' \
          | curl -s -o /dev/null -w "IndexNow: HTTP %{http_code}\n" -X POST https://api.indexnow.org/indexnow \
              -H 'Content-Type: application/json; charset=utf-8' --data-binary @-
